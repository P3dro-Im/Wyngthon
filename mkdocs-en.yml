site_name: Wyngthon Docs
site_description: Documentation of the Wyngthon library for Wyng
site_url: https://p3dro-im.github.io/Wyngthon/en/
repo_url: https://github.com/P3dro-Im/Wyngthon
repo_name: Wyngthon

docs_dir: docs_en
site_dir: site/en

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

extra:
  alternate:
    - name: فارسی
      link: /Wyngthon/
      lang: fa
    - name: English
      link: /Wyngthon/en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/P3dro-Im/Wyngthon
    - icon: fontawesome/brands/telegram
      link: https://web.wyng.ir
  generator: false

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Installation: installation.md
  - Core Concepts:
      - concepts/index.md
      - Entities: concepts/entities.md
      - Sessions: concepts/sessions.md
      - Events: concepts/events.md
      - String Sessions: concepts/string-sessions.md
      - Error Handling: concepts/errors.md
      - Full API: concepts/full-api.md
      - Bot API vs MTProto: concepts/botapi-vs-mtproto.md
      - Mastering asyncio: concepts/asyncio.md
  - Examples:
      - examples/index.md
      - Users: examples/users.md
      - Chats and Channels: examples/chats-and-channels.md
      - Working with Messages: examples/working-with-messages.md
      - A Word of Warning: examples/word-of-warning.md
  - API Reference: api-reference.md
  - FAQ: faq.md

extra_css:
  - stylesheets/extra.css
