<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Wyngthon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F4B"/>
      <stop offset="1" stop-color="#0D1030"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#6D8CFF"/>
      <stop offset="1" stop-color="#B07CFF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- soft echo of the mark for depth -->
  <path d="M112 196 L186 372 L256 238 L326 372 L400 196"
        fill="none" stroke="#38BDF8" stroke-opacity="0.22"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the "W" drawn as one continuous line -->
  <path d="M112 160 L186 336 L256 202 L326 336 L400 160"
        fill="none" stroke="url(#stroke)"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- connection node -->
  <circle cx="400" cy="160" r="15" fill="#0D1030"/>
</svg>
